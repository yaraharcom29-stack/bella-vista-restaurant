<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bella Vista | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root {
--gold: #d4af37;
--gold-light: #e8c968;
--bg: #0d0d0d;
--panel: #161616;
--panel-2: #1e1e1e;
--border: #2a2a2a;
--text: #f0f0f0;
--text-dim: #999;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Poppins', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
}
#loginScreen {
display: flex;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 20px;
}
.login-card {
background: var(--panel);
border: 1px solid var(--border);
border-radius: 14px;
padding: 48px 40px;
max-width: 380px;
width: 100%;
text-align: center;
}
.login-card i { font-size: 32px; color: var(--gold); margin-bottom: 14px; }
.login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.login-card p { color: var(--text-dim); font-size: 13px; margin-bottom: 26px; }
.login-card input {
width: 100%;
padding: 14px 16px;
border-radius: 10px;
border: 1px solid var(--border);
background: var(--panel-2);
color: var(--text);
font-size: 15px;
margin-bottom: 14px;
outline: none;
}
.login-card input:focus { border-color: var(--gold); }
.login-card button {
width: 100%;
padding: 14px;
border-radius: 10px;
border: none;
background: var(--gold);
color: #111;
font-weight: 600;
font-size: 15px;
cursor: pointer;
transition: background .2s;
}
.login-card button:hover { background: var(--gold-light); }
#loginError { color: #e57373; font-size: 13px; margin-top: 12px; display: none; }
#dashboard { display: none; }
.topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 20px 32px;
border-bottom: 1px solid var(--border);
background: var(--panel);
flex-wrap: wrap;
gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; color: var(--gold); }
.brand span { color: var(--text); font-weight: 400; font-size: 14px; margin-left: 4px; }
.logout-btn {
background: transparent;
border: 1px solid var(--border);
color: var(--text-dim);
padding: 9px 16px;
border-radius: 8px;
cursor: pointer;
font-size: 13px;
transition: all .2s;
}
.logout-btn:hover { border-color: var(--gold); color: var(--gold); }
.content { padding: 28px 32px 60px; max-width: 1200px; margin: 0 auto; }
.stats-row {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
gap: 16px;
margin-bottom: 28px;
}
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--gold); }
.stat-card .lbl { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.toolbar { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.toolbar input {
flex: 1;
min-width: 200px;
padding: 11px 16px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--panel);
color: var(--text);
font-size: 14px;
outline: none;
}
.toolbar input:focus { border-color: var(--gold); }
.toolbar button {
padding: 11px 18px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--panel);
color: var(--text);
cursor: pointer;
font-size: 13px;
transition: all .2s;
}
.toolbar button:hover { border-color: var(--gold); color: var(--gold); }
.table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 700px; }
th {
text-align: left;
padding: 14px 18px;
background: var(--panel-2);
color: var(--text-dim);
font-size: 12px;
text-transform: uppercase;
letter-spacing: .5px;
border-bottom: 1px solid var(--border);
}
td { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 14px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(212, 175, 55, 0.04); }
.row-today td { background: rgba(212, 175, 55, 0.08); }
.name-cell { font-weight: 600; }
.muted { color: var(--text-dim); font-size: 13px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state i { font-size: 36px; margin-bottom: 12px; color: var(--border); }
.tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.tab-btn {
background: transparent;
border: none;
color: var(--text-dim);
padding: 12px 4px;
margin-right: 24px;
font-size: 14px;
font-weight: 500;
cursor: pointer;
border-bottom: 2px solid transparent;
transition: all .2s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.view { display: none; }
.view.active { display: block; }
.item-img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--panel-2); }
.badge-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--gold); color: #111; }
.badge-pill.new { background: #4caf50; color: #fff; }
.action-btns { display: flex; gap: 8px; }
.icon-btn {
width: 32px;
height: 32px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--panel-2);
color: var(--text-dim);
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all .2s;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold); }
.icon-btn.danger:hover { border-color: #e57373; color: #e57373; }
.add-btn {
padding: 11px 20px;
border-radius: 8px;
border: none;
background: var(--gold);
color: #111;
font-weight: 600;
cursor: pointer;
font-size: 13px;
display: flex;
align-items: center;
gap: 8px;
transition: background .2s;
}
.add-btn:hover { background: var(--gold-light); }
.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.7);
align-items: center;
justify-content: center;
padding: 20px;
z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal-box {
background: var(--panel);
border: 1px solid var(--border);
border-radius: 14px;
padding: 30px;
max-width: 440px;
width: 100%;
max-height: 90vh;
overflow-y: auto;
}
.modal-box h3 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.modal-box h3 i { cursor: pointer; color: var(--text-dim); font-size: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.form-group input, .form-group textarea, .form-group select {
width: 100%;
padding: 11px 14px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--panel-2);
color: var(--text);
font-family: inherit;
font-size: 14px;
outline: none;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--gold); }
.modal-actions { display: flex; gap: 10px; margin-top: 22px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn-cancel { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border) !important; }
.btn-save { background: var(--gold); color: #111; }
.btn-save:hover { background: var(--gold-light); }
@media (max-width: 600px) {
.topbar, .content { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div id="loginScreen">
<div class="login-card">
<i class="fa-solid fa-lock"></i>
<h1>Bella Vista Admin</h1>
<p>Enter your password to view reservations</p>
<input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
<button onclick="checkPassword()">Sign In</button>
<div id="loginError">Incorrect password, try again.</div>
</div>
</div>

<div id="dashboard">
<div class="topbar">
<div class="brand"><i class="fa-solid fa-utensils"></i> Bella Vista <span>Admin Dashboard</span></div>
<button class="logout-btn" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</button>
</div>
<div class="content">
<div class="tabs">
<button class="tab-btn active" id="tabReservationsBtn" onclick="switchTab('reservations')">
<i class="fa-solid fa-calendar-check"></i> Reservations
</button>
<button class="tab-btn" id="tabMenuBtn" onclick="switchTab('menu')">
<i class="fa-solid fa-utensils"></i> Menu
</button>
</div>

<div class="view active" id="reservationsView">
<div class="stats-row">
<div class="stat-card"><div class="num" id="statTotal">–</div><div class="lbl">Total Reservations</div></div>
<div class="stat-card"><div class="num" id="statToday">–</div><div class="lbl">For Today</div></div>
<div class="stat-card"><div class="num" id="statUpcoming">–</div><div class="lbl">Upcoming</div></div>
</div>
<div class="toolbar">
<input type="text" id="searchInput" placeholder="Search by name, email or phone..." oninput="renderTable()">
<button onclick="loadReservations()"><i class="fa-solid fa-rotate"></i> Refresh</button>
</div>
<div class="table-wrap">
<table id="resTable">
<thead>
<tr><th>Name</th><th>Contact</th><th>Reservation Date</th><th>Time</th><th>Submitted</th></tr>
</thead>
<tbody id="resTableBody"></tbody>
</table>
<div class="empty-state" id="emptyState" style="display:none;">
<i class="fa-solid fa-calendar-xmark"></i>
<div>No reservations found</div>
</div>
</div>
</div>

<div class="view" id="menuView">
<div class="toolbar">
<input type="text" id="menuSearchInput" placeholder="Search dishes..." oninput="renderMenuTable()">
<button class="add-btn" onclick="openMenuModal()"><i class="fa-solid fa-plus"></i> Add Item</button>
</div>
<div class="table-wrap">
<table id="menuTable">
<thead>
<tr><th>Dish</th><th>Description</th><th>Price</th><th>Badge</th><th></th></tr>
</thead>
<tbody id="menuTableBody"></tbody>
</table>
<div class="empty-state" id="menuEmptyState" style="display:none;">
<i class="fa-solid fa-utensils"></i>
<div>No menu items found</div>
</div>
</div>
</div>
</div>
</div>

<div class="modal-overlay" id="menuModal">
<div class="modal-box">
<h3>
<span id="menuModalTitle">Add Dish</span>
<i class="fa-solid fa-xmark" onclick="closeMenuModal()"></i>
</h3>
<div class="form-group"><label>Dish Name</label><input type="text" id="menuName" placeholder="e.g. Margherita Pizza"></div>
<div class="form-group"><label>Description</label><textarea id="menuDescription" rows="2" placeholder="Short description..."></textarea></div>
<div class="form-group"><label>Price ($)</label><input type="number" id="menuPrice" placeholder="18"></div>
<div class="form-group">
<label>Dish Image</label>
<input type="file" id="menuImageFile" accept="image/*">
<div id="menuImagePreviewWrap" style="margin-top:10px; display:none;">
<img id="menuImagePreview" style="max-width:120px; border-radius:8px;" alt="preview">
</div>
<input type="hidden" id="menuImage">
</div>
<div class="form-group">
<label>Badge (optional)</label>
<select id="menuBadge">
<option value="">None</option>
<option value="Best Seller">Best Seller</option>
<option value="New">New</option>
</select>
</div>
<div class="modal-actions">
<button class="btn-cancel" onclick="closeMenuModal()">Cancel</button>
<button class="btn-save" id="menuSaveBtn" onclick="saveMenuItem()">Save</button>
</div>
</div>
</div>

<script>
// غيّري كلمة السر دي لأي حاجة تانية تحبيها
const ADMIN_PASSWORD = "bellavista2026";
const SHEET_URL = "https://script.google.com/macros/s/AKfycby68sowQzuMzwNjKhFVvJHwa4OW6s0pUP9hNzxZSwr-fFGPVObYHZEANL2WCiovEMXe/exec";
// لازم يكون نفس القيمة بالظبط اللي حطيتيها في SECRET_KEY جوه Code.gs
const SECRET_KEY = "Qk7mR2vXpL9wT4nY6zJ8s";

let allReservations = [];

// بتحول أي نص جاي من المستخدم لنص آمن قبل ما يتحط جوه الصفحة
// ده بيمنع أي كود HTML/JS حد يكتبه في اسم الحجز أو وصف الصنف من إنه يتنفذ
function escapeHtml(value) {
return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
"&": "&amp;",
"<": "&lt;",
">": "&gt;",
'"': "&quot;",
"'": "&#39;",
}[ch]));
}

// الصورة ممكن تكون رابط كامل (لو اترفعت من جوجل درايف) أو اسم ملف محلي قديم في مجلد images
function resolveImageSrc(image) {
if (!image) return "";
if (/^https?:\/\//i.test(image)) return image;
return "images/" + encodeURIComponent(image);
}

function checkPassword() {
const input = document.getElementById("passwordInput").value;
const errorEl = document.getElementById("loginError");
if (input === ADMIN_PASSWORD) {
sessionStorage.setItem("bv_admin_auth", "1");
document.getElementById("loginScreen").style.display = "none";
document.getElementById("dashboard").style.display = "block";
loadReservations();
} else {
errorEl.style.display = "block";
}
}

function logout() {
sessionStorage.removeItem("bv_admin_auth");
location.reload();
}

document.getElementById("passwordInput").addEventListener("keydown", (e) => {
if (e.key === "Enter") checkPassword();
});

function fmtDate(iso) {
if (!iso) return "-";
const d = new Date(iso);
if (isNaN(d)) return iso;
return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function fmtTime(iso) {
if (!iso) return "-";
// لو الوقت متسجل كنص بسيط زي "17:22" (مش تاريخ كامل)، نحوّله يدويًا لنفس شكل الـ 12 ساعة
const simpleMatch = String(iso).match(/^(\d{1,2}):(\d{2})$/);
if (simpleMatch) {
let hours = parseInt(simpleMatch[1], 10);
const minutes = simpleMatch[2];
const ampm = hours >= 12 ? "PM" : "AM";
hours = hours % 12 || 12;
return `${hours}:${minutes} ${ampm}`;
}
const d = new Date(iso);
if (isNaN(d)) return iso;
return d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
}

function isToday(iso) {
if (!iso) return false;
const d = new Date(iso);
const t = new Date();
return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
}

function isUpcoming(iso) {
if (!iso) return false;
const d = new Date(iso);
const t = new Date();
t.setHours(0, 0, 0, 0);
return d >= t;
}

function loadReservations() {
const tbody = document.getElementById("resTableBody");
tbody.innerHTML = `<tr><td colspan="5" class="muted" style="text-align:center;padding:30px;">Loading...</td></tr>`;
fetch(SHEET_URL + "?action=reservations&key=" + encodeURIComponent(SECRET_KEY) + "&t=" + Date.now(), { cache: "no-store" })
.then((res) => res.json())
.then((data) => {
allReservations = data.reverse();
updateStats();
renderTable();
})
.catch((err) => {
console.error("Failed to load reservations:", err);
tbody.innerHTML = `<tr><td colspan="5" class="muted" style="text-align:center;padding:30px;">Failed to load data. Try refreshing.</td></tr>`;
});
}

function updateStats() {
document.getElementById("statTotal").textContent = allReservations.length;
document.getElementById("statToday").textContent = allReservations.filter(r => isToday(r["Reservation Date"])).length;
document.getElementById("statUpcoming").textContent = allReservations.filter(r => isUpcoming(r["Reservation Date"])).length;
}

function renderTable() {
const query = document.getElementById("searchInput").value.toLowerCase();
const tbody = document.getElementById("resTableBody");
const emptyState = document.getElementById("emptyState");
const filtered = allReservations.filter((r) => {
const haystack = `${r.Name || ""} ${r.Email || ""} ${r.Phone || ""}`.toLowerCase();
return haystack.includes(query);
});
if (filtered.length === 0) {
tbody.innerHTML = "";
emptyState.style.display = "block";
return;
}
emptyState.style.display = "none";
tbody.innerHTML = filtered.map((r) => `
<tr class="${isToday(r['Reservation Date']) ? 'row-today' : ''}">
<td class="name-cell">${escapeHtml(r.Name || "-")}</td>
<td>
<div>${escapeHtml(r.Email || "-")}</div>
<div class="muted">${escapeHtml(r.Phone || "-")}</div>
</td>
<td>${fmtDate(r["Reservation Date"])}</td>
<td>${fmtTime(r["Reservation Time"])}</td>
<td class="muted">${fmtDate(r["Date Submitted"])}</td>
</tr>
`).join("");
}

function switchTab(tab) {
document.getElementById("tabReservationsBtn").classList.toggle("active", tab === "reservations");
document.getElementById("tabMenuBtn").classList.toggle("active", tab === "menu");
document.getElementById("reservationsView").classList.toggle("active", tab === "reservations");
document.getElementById("menuView").classList.toggle("active", tab === "menu");
if (tab === "menu" && allMenuItems.length === 0) loadMenuItems();
}

let allMenuItems = [];
let editingItemName = null;

function loadMenuItems() {
const tbody = document.getElementById("menuTableBody");
tbody.innerHTML = `<tr><td colspan="5" class="muted" style="text-align:center;padding:30px;">Loading...</td></tr>`;
fetch(SHEET_URL + "?t=" + Date.now(), { cache: "no-store" })
.then((res) => res.json())
.then((data) => {
allMenuItems = data;
renderMenuTable();
})
.catch((err) => {
console.error("Failed to load menu:", err);
tbody.innerHTML = `<tr><td colspan="5" class="muted" style="text-align:center;padding:30px;">Failed to load menu.</td></tr>`;
});
}

function renderMenuTable() {
const query = document.getElementById("menuSearchInput").value.toLowerCase();
const tbody = document.getElementById("menuTableBody");
const emptyState = document.getElementById("menuEmptyState");
const filtered = allMenuItems.filter((item) =>
(item.name || "").toLowerCase().includes(query)
);
if (filtered.length === 0) {
tbody.innerHTML = "";
emptyState.style.display = "block";
return;
}
emptyState.style.display = "none";
tbody.innerHTML = filtered.map((item) => {
// بنلاقي مكان الصنف ده في المصفوفة الأصلية (مش المفلترة) عشان نرجعله صح بعدين
const realIndex = allMenuItems.indexOf(item);
return `
<tr>
<td>
<div style="display:flex;align-items:center;gap:12px;">
<img class="item-img" src="${resolveImageSrc(item.image)}" onerror="this.style.opacity=0.2" alt="">
<span class="name-cell">${escapeHtml(item.name)}</span>
</div>
</td>
<td class="muted">${escapeHtml(item.description)}</td>
<td>$${escapeHtml(item.price)}</td>
<td>${item.badge ? `<span class="badge-pill${item.badge.toLowerCase() === 'new' ? ' new' : ''}">${escapeHtml(item.badge)}</span>` : '<span class="muted">-</span>'}</td>
<td>
<div class="action-btns">
<button class="icon-btn" onclick="openMenuModalByIndex(${realIndex})" title="Edit">
<i class="fa-solid fa-pen"></i>
</button>
<button class="icon-btn danger" onclick="deleteMenuItemByIndex(${realIndex})" title="Delete">
<i class="fa-solid fa-trash"></i>
</button>
</div>
</td>
</tr>
`;
}).join("");
}

// بتاخد رقم الصنف في المصفوفة بدل ما تاخد بياناته كاملة جوه الـ onclick
// ده أأمن وأبسط من إننا نحط JSON خام جوه attribute في الصفحة
function openMenuModalByIndex(index) {
openMenuModal(allMenuItems[index]);
}

function deleteMenuItemByIndex(index) {
const item = allMenuItems[index];
if (item) deleteMenuItem(item.name);
}

function openMenuModal(item) {
document.getElementById("menuModal").classList.add("active");
document.getElementById("menuImageFile").value = "";
if (item) {
editingItemName = item.name;
document.getElementById("menuModalTitle").textContent = "Edit Dish";
document.getElementById("menuName").value = item.name || "";
document.getElementById("menuDescription").value = item.description || "";
document.getElementById("menuPrice").value = item.price || "";
document.getElementById("menuImage").value = item.image || "";
document.getElementById("menuBadge").value = item.badge || "";
if (item.image) {
document.getElementById("menuImagePreview").src = resolveImageSrc(item.image);
document.getElementById("menuImagePreviewWrap").style.display = "block";
} else {
document.getElementById("menuImagePreviewWrap").style.display = "none";
}
} else {
editingItemName = null;
document.getElementById("menuModalTitle").textContent = "Add Dish";
document.getElementById("menuName").value = "";
document.getElementById("menuDescription").value = "";
document.getElementById("menuPrice").value = "";
document.getElementById("menuImage").value = "";
document.getElementById("menuBadge").value = "";
document.getElementById("menuImagePreviewWrap").style.display = "none";
}
}

document.getElementById("menuImageFile").addEventListener("change", function () {
const file = this.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function (e) {
document.getElementById("menuImagePreview").src = e.target.result;
document.getElementById("menuImagePreviewWrap").style.display = "block";
};
reader.readAsDataURL(file);
});

function fileToBase64(file) {
return new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = () => resolve(reader.result.split(",")[1]); // بنشيل جزء "data:image/...;base64," ونسيب النص بس
reader.onerror = reject;
reader.readAsDataURL(file);
});
}

// بترفع الصورة المختارة لجوجل درايف وترجع رابطها، أو null لو مفيش صورة جديدة متختارة
async function uploadSelectedImage() {
const fileInput = document.getElementById("menuImageFile");
const file = fileInput.files[0];
if (!file) return null;

const base64 = await fileToBase64(file);
const res = await fetch(SHEET_URL, {
method: "POST",
headers: { "Content-Type": "text/plain" },
body: JSON.stringify({
type: "menu_upload_image",
key: SECRET_KEY,
imageData: base64,
mimeType: file.type || "image/jpeg",
filename: file.name || "image.jpg",
}),
});
const data = await res.json();
if (data.result !== "success") {
throw new Error(data.message || "فشل رفع الصورة");
}
return data.url;
}

function closeMenuModal() {
document.getElementById("menuModal").classList.remove("active");
}

async function saveMenuItem() {
const name = document.getElementById("menuName").value.trim();
const description = document.getElementById("menuDescription").value.trim();
const price = document.getElementById("menuPrice").value.trim();
const badge = document.getElementById("menuBadge").value;
let image = document.getElementById("menuImage").value.trim(); // الرابط القديم لو بنعدّل ومختارناش صورة جديدة

if (!name || !price) {
alert("Please fill in at least the name and price.");
return;
}

const saveBtn = document.getElementById("menuSaveBtn");
saveBtn.disabled = true;
saveBtn.textContent = "Saving...";

try {
const newImageUrl = await uploadSelectedImage();
if (newImageUrl) image = newImageUrl;

if (!image) {
alert("من فضلك اختاري صورة للطبق.");
return;
}

const payload = editingItemName
? { type: "menu_update", key: SECRET_KEY, originalName: editingItemName, name, description, price, image, badge }
: { type: "menu_add", key: SECRET_KEY, name, description, price, image, badge };

await fetch(SHEET_URL, {
method: "POST",
mode: "no-cors",
headers: { "Content-Type": "text/plain" },
body: JSON.stringify(payload),
});

closeMenuModal();
setTimeout(loadMenuItems, 800);
} catch (err) {
console.error("Failed to save item:", err);
alert("حصلت مشكلة وإحنا بنحفظ الطبق ده. جربي تاني.");
} finally {
saveBtn.disabled = false;
saveBtn.textContent = "Save";
}
}

function deleteMenuItem(name) {
if (!confirm(`Delete "${name}" from the menu? This can't be undone.`)) return;
fetch(SHEET_URL, {
method: "POST",
mode: "no-cors",
headers: { "Content-Type": "text/plain" },
body: JSON.stringify({ type: "menu_delete", key: SECRET_KEY, name }),
})
.then(() => {
setTimeout(loadMenuItems, 800);
})
.catch((err) => {
console.error("Failed to delete item:", err);
alert("Something went wrong deleting this item.");
});
}

if (sessionStorage.getItem("bv_admin_auth") === "1") {
document.getElementById("loginScreen").style.display = "none";
document.getElementById("dashboard").style.display = "block";
loadReservations();
}
</script>
</body>
